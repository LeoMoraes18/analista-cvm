[project]
name = "analista-cvm"
version = "0.1.0"
description = "Agente que analisa demonstrações financeiras de companhias abertas com os dados abertos da CVM"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
analista = "analista.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analista"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
